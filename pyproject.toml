[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dimasqp-va"
version = "1.0.0"
description = "Opinion-prior supervision and VA heads for Dimensional Aspect Sentiment Quad Prediction (ICONIP 2026)."
readme = "README.md"
authors = [{ name = "Yaoshuo Wu" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["torch>=1.13"]
keywords = ["aspect-based sentiment analysis", "valence-arousal", "DimABSA", "DimASQP"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/Potato0705/DimASQP"

[tool.setuptools]
packages = ["dimasqp_va"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
